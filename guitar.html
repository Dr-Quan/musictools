<script>
(function(){
    const FRET_COUNT = 18;
    const STRINGS = [
        { name: "E4", midi: 64, note: "e" },
        { name: "B3", midi: 59, note: "h" },
        { name: "G3", midi: 55, note: "g" },
        { name: "D3", midi: 50, note: "d" },
        { name: "A2", midi: 45, note: "a" },
        { name: "E2", midi: 40, note: "e" }
    ];
    
    const NOTE_NAMES = ["c", "cis", "d", "dis", "e", "f", "fis", "g", "gis", "a", "ais", "h"];
    const NOTE_DISPLAY = {
        "c": "C", "cis": "升C", "d": "D", "dis": "升D", "e": "E", "f": "F",
        "fis": "升F", "g": "G", "gis": "升G", "a": "A", "ais": "升A", "h": "B"
    };
    
    function fretWidth(n) {
        return Math.pow(2, -(n-1)/12) - Math.pow(2, -n/12);
    }
    
    function getNoteName(midi) {
        return NOTE_NAMES[midi % 12];
    }
    
    function getNoteDisplay(midi) {
        return NOTE_DISPLAY[getNoteName(midi)];
    }
    
    function generateFretboard() {
        const fretboardList = document.getElementById('fretboard-list');
        
        // 生成0品（空弦）
        const openFret = document.createElement('li');
        openFret.className = 'fret--first';
        
        STRINGS.forEach((string, index) => {
            const span = document.createElement('span');
            span.setAttribute('note', string.note);
            span.className = `note-${string.note}1`;
            
            const openName = document.createElement('span');
            openName.className = 'open-fret-note-name';
            openName.textContent = string.name.charAt(0);
            
            const noteName = document.createElement('i');
            noteName.className = 'note-name';
            const innerSpan = document.createElement('span');
            innerSpan.textContent = string.name.charAt(0);
            noteName.appendChild(innerSpan);
            
            span.appendChild(openName);
            span.appendChild(noteName);
            
            // 绑定点击事件
            span.onclick = function() {
                playGuitarNote(string.midi);
                this.classList.toggle('active--note');
            };
            span.ontouchstart = function(e) {
                e.preventDefault();
                playGuitarNote(string.midi);
                this.classList.toggle('active--note');
            };
            
            openFret.appendChild(span);
        });
        
        fretboardList.appendChild(openFret);
        
        // 生成1-18品
        for (let fret = 1; fret <= FRET_COUNT; fret++) {
            const li = document.createElement('li');
            
            // 添加品位标记
            if (fret === 3 || fret === 5 || fret === 7 || fret === 9 || fret === 15 || fret === 17) {
                const dots = document.createElement('div');
                dots.className = 'dots';
                li.appendChild(dots);
            } else if (fret === 12) {
                const dotsDouble = document.createElement('div');
                dotsDouble.className = 'dots-double';
                dotsDouble.innerHTML = '<span></span><span></span>';
                li.appendChild(dotsDouble);
            }
            
            // 为每根弦生成音符
            STRINGS.forEach((string, stringIndex) => {
                const midi = string.midi + fret;
                const noteName = getNoteName(midi);
                const displayName = getNoteDisplay(midi);
                
                const span = document.createElement('span');
                span.setAttribute('note', noteName);
                span.className = `note-${string.note}${fret + 1}`;
                
                const noteI = document.createElement('i');
                noteI.className = 'note-name';
                const innerSpan = document.createElement('span');
                innerSpan.textContent = displayName;
                noteI.appendChild(innerSpan);
                
                span.appendChild(noteI);
                
                // 绑定点击事件
                span.onclick = function() {
                    playGuitarNote(midi);
                    this.classList.toggle('active--note');
                };
                span.ontouchstart = function(e) {
                    e.preventDefault();
                    playGuitarNote(midi);
                    this.classList.toggle('active--note');
                };
                
                li.appendChild(span);
            });
            
            // 设置品格宽度（对数分布）
            const widthPercent = fretWidth(fret) * 2000;
            li.style.flex = `0 0 ${widthPercent}px`;
            
            fretboardList.appendChild(li);
        }
    }
    
    /* ==========================
       WebAudio
    ========================== */
    let audioCtx = null;
    
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }
        return audioCtx;
    }
    
    function ensureAudio() {
        if (!audioCtx || audioCtx.state === "closed") {
            audioCtx = null;
            return initAudio();
        }
        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }
        return audioCtx;
    }
    
    function midiFreq(note) {
        return 440 * Math.pow(2, (note - 69) / 12);
    }
    
    function createGuitarBuffer(ctx, freq, velocity = 0.8) {
        const rate = ctx.sampleRate;
        const duration = 2.8;
        const buffer = ctx.createBuffer(1, Math.floor(rate * duration), rate);
        const data = buffer.getChannelData(0);
        
        let delay = rate / freq;
        delay = Math.max(delay, 2);
        
        const ring = new Float32Array(Math.ceil(delay) + 2);
        
        for (let i = 0; i < ring.length; i++) {
            let n = Math.random() * 2 - 1;
            n *= (i % 5 === 0) ? 1.25 : 1;
            ring[i] = n;
        }
        
        let index = 0;
        let previous = 0;
        const decay = freq < 150 ? 0.992 : 0.995;
        
        for (let i = 0; i < data.length; i++) {
            let sample = ring[index];
            data[i] = sample * velocity;
            
            let nextIndex = index + 1;
            if (nextIndex >= ring.length) nextIndex = 0;
            let next = ring[nextIndex];
            
            let filtered = (sample + next) * 0.5;
            filtered = filtered * 0.995 + previous * 0.005;
            previous = filtered;
            
            ring[index] = filtered * decay;
            index++;
            if (index >= ring.length) index = 0;
        }
        
        return buffer;
    }
    
    function playGuitarNote(midi, velocity = 0.8) {
        const ctx = ensureAudio();
        if (!ctx) return;
        
        const freq = midiFreq(midi);
        const source = ctx.createBufferSource();
        source.buffer = createGuitarBuffer(ctx, freq, velocity);
        
        const lowCut = ctx.createBiquadFilter();
        lowCut.type = "highpass";
        lowCut.frequency.value = 90;
        
        const high = ctx.createBiquadFilter();
        high.type = "highshelf";
        high.frequency.value = 1800;
        high.gain.value = 6;
        
        const attack = ctx.createBiquadFilter();
        attack.type = "peaking";
        attack.frequency.value = 3500;
        attack.Q.value = 1.3;
        attack.gain.value = 3;
        
        const gain = ctx.createGain();
        let comp = Math.pow(freq / 440, 0.22);
        gain.gain.value = 0.65 + comp * 0.25;
        
        source.connect(lowCut);
        lowCut.connect(high);
        high.connect(attack);
        attack.connect(gain);
        gain.connect(ctx.destination);
        
        source.start();
    }
    
    // 初始化
    generateFretboard();
    
    document.addEventListener("click", function once() {
        initAudio();
        document.removeEventListener("click", once);
    }, { once: true });
    
})();
</script>
